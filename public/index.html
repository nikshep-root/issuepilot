<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IssuePilot</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><section class="hero"><p class="eyebrow">ISSUEPILOT / MVP</p><h1>Turn an issue into a tested commit.</h1><p>Clone a repository in isolation, analyze it, let Codex implement the fix, repair tests, and review the result.</p></section>
<section class="panel"><form id="run-form"><label>GitHub repository URL<input name="repoUrl" type="url" required placeholder="https://github.com/owner/repository.git"></label><label>Issue title<input name="title" required placeholder="e.g. Fix duplicate notifications"></label><label>Issue description<textarea name="description" required rows="6" placeholder="Describe the bug, expected behavior, and acceptance criteria."></textarea></label><label class="check"><input name="createPr" type="checkbox"> Create a PR after commit when <code>GITHUB_TOKEN</code> is configured</label><button>Run IssuePilot <span>→</span></button></form></section>
<section id="result" class="result hidden" aria-live="polite"></section></main><script type="module" src="/app.js"></script></body></html>
